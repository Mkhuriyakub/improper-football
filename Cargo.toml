[package]
name = "improper-football"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14" }
physics = { path = "crates/physics" }
ball = { path = "crates/ball" }
player = { path = "crates/player" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace]
members = [
    ".",
    "crates/physics",
    "crates/ball",
    "crates/player",
]
